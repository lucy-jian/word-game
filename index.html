<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>루시와 영어 단어 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff0f6; --bg2:#f3e8ff; --bg3:#e3f3fe;
  --card:#ffffff; --text:#4a3757; --muted:#8c7a9c; --border:#f1dcef;
  --pink:#f06fa4; --pink-d:#cf4f86; --pink-soft:#ffe3ef;
  --purple:#9b6ce8; --purple-d:#7a4fc9; --purple-soft:#efe5ff;
  --sky:#4fa9e6; --sky-d:#3389c4; --sky-soft:#dff1fd;
  --mint:#38b886; --mint-soft:#dcf6ea;
  --sun:#f5b93a; --sun-soft:#fff3cf;
  --oops:#f29a9a; --oops-soft:#ffe9e9;
  --head:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a2139; --bg2:#231c33; --bg3:#1c2536;
    --card:#33294a; --text:#f7eeff; --muted:#c4b3d9; --border:#4b3d63;
    --pink-soft:#55304a; --purple-soft:#41335e; --sky-soft:#29405a;
    --mint-soft:#244538; --sun-soft:#4a3f22; --oops-soft:#4e2d33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a2139; --bg2:#231c33; --bg3:#1c2536;
  --card:#33294a; --text:#f7eeff; --muted:#c4b3d9; --border:#4b3d63;
  --pink-soft:#55304a; --purple-soft:#41335e; --sky-soft:#29405a;
  --mint-soft:#244538; --sun-soft:#4a3f22; --oops-soft:#4e2d33;
  color-scheme: dark;
}
/* 모험 장소별 배경 */
body[data-place="forest"]{--bg1:#e9fbe8;--bg2:#f4fbe1;--bg3:#dff5ee}
body[data-place="castle"]{--bg1:#eef2ff;--bg2:#f6ecff;--bg3:#fdf2fa}
body[data-place="sea"]{--bg1:#e1f5ff;--bg2:#d8eefb;--bg3:#e4faf5}
body[data-place="space"]{--bg1:#ebe7ff;--bg2:#e0e2fb;--bg3:#f4e9ff}
body[data-place="candy"]{--bg1:#fff0f6;--bg2:#fff4e2;--bg3:#fde7f6}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body[data-place="forest"]{--bg1:#1c2a24;--bg2:#222b20;--bg3:#1b2830}
  :root:not([data-theme="light"]) body[data-place="castle"]{--bg1:#232640;--bg2:#2a2140;--bg3:#30233a}
  :root:not([data-theme="light"]) body[data-place="sea"]{--bg1:#17283a;--bg2:#16303a;--bg3:#1a2f33}
  :root:not([data-theme="light"]) body[data-place="space"]{--bg1:#16142b;--bg2:#1d1b38;--bg3:#251a35}
  :root:not([data-theme="light"]) body[data-place="candy"]{--bg1:#33212f;--bg2:#33281f;--bg3:#2f1f30}
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--body); color:var(--text); font-size:17px; line-height:1.6;
  background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%) fixed;
  background-color:var(--bg1);
  -webkit-tap-highlight-color:transparent;
  transition:background-color .6s;
}
#app{max-width:680px;margin:0 auto;padding:16px 16px 48px;position:relative;z-index:1}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco span{position:absolute;bottom:-50px;opacity:.38;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-118vh) rotate(220deg)}}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0 0 10px;line-height:1.3}
h3{font-size:1.3rem}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--purple);outline-offset:2px}

/* 버튼 */
.btn{
  font-family:var(--head); font-size:1.2rem; border:none; border-radius:999px;
  padding:13px 24px; color:#fff; background:var(--pink); box-shadow:0 5px 0 var(--pink-d);
  transition:transform .08s, box-shadow .08s; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.purple{background:var(--purple);box-shadow:0 5px 0 var(--purple-d)}
.btn.purple:active{box-shadow:0 1px 0 var(--purple-d)}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:0 4px 0 var(--border);border:2px solid var(--border)}
.btn.ghost:active{box-shadow:0 0 0 var(--border)}
.btn.sm{font-size:1rem;padding:8px 16px}
.btn.xl{font-size:1.5rem;padding:18px 28px;width:100%}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}

/* 상단 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 0;background:var(--bg1)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
.icon-btn{border:2px solid var(--border);background:var(--card);border-radius:50%;width:46px;height:46px;font-size:1.3rem;flex:none}
.pill{background:var(--card);border:2px solid var(--border);border-radius:999px;padding:6px 12px;font-family:var(--head);font-size:1.02rem;white-space:nowrap}
.spacer{flex:1}

/* 루시 */
.lucy{display:flex;align-items:flex-end;gap:10px;margin:6px 0 16px}
.lucy-ava{
  flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;
  background:radial-gradient(circle at 35% 30%,#fff 0%,var(--purple-soft) 45%,var(--pink-soft) 100%);
  border:3px solid var(--card); box-shadow:0 0 0 3px var(--purple-soft);
  animation:float 3.2s ease-in-out infinite;
}
.lucy-ava.swap{animation:pop .35s ease, float 3.2s ease-in-out .35s infinite}
.bubble{position:relative;background:var(--card);border:2px solid var(--border);border-radius:22px 22px 22px 6px;padding:12px 16px;font-size:1.08rem;flex:1;min-width:0}
.bubble.pop{animation:pop .35s ease}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

/* 카드 */
.card{background:var(--card);border:2px solid var(--border);border-radius:24px;padding:18px;margin-bottom:16px}
.progress{height:14px;border-radius:999px;background:var(--purple-soft);overflow:hidden;margin:10px 0 6px}
.progress>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .4s}

/* 처음 화면 */
.logo{font-size:2.3rem;text-align:center;margin:18px 0 6px;color:var(--purple)}
.logo span{display:block;font-size:2.9rem;color:var(--pink);letter-spacing:-1px}
.stat-row{display:flex;align-items:center;gap:16px}
.big-star{font-family:var(--head);font-size:2.4rem;color:var(--sun)}
.title-name{font-family:var(--head);font-size:1.35rem}
.streak{margin-top:8px;font-family:var(--head);color:var(--pink)}
.home-btns{display:grid;gap:14px}

/* 탭, 입력 */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;font-family:var(--head);font-size:1.15rem;padding:12px;border-radius:18px;border:2px solid var(--border);background:var(--card)}
.tab.on{background:var(--purple);border-color:var(--purple);color:#fff}
label,.label-like{display:block;font-family:var(--head);font-size:1.1rem;margin:10px 0 6px}
.input,textarea{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:16px;border:2px solid var(--border);background:var(--card);color:var(--text)}
.input.big{font-size:1.45rem;padding:14px 16px}
textarea{min-height:130px;resize:vertical;font-size:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.sel-emo{font-size:1.4rem;vertical-align:middle}
.pk-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.pk-tab{flex:none;border:2px solid var(--border);background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--head);font-size:.95rem}
.pk-tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin:6px 0 14px}
.emo{font-size:1.65rem;height:50px;border-radius:14px;border:2px solid var(--border);background:var(--card)}
.emo.on{border-color:var(--pink);background:var(--pink-soft);transform:scale(1.06)}
.photo-field{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
label.photo-btn{display:inline-flex;margin:0;cursor:pointer;font-size:1rem}
.photo-prev{display:flex;align-items:center;gap:6px}
.photo-prev img{width:64px;height:64px;object-fit:cover;border-radius:14px;border:2px solid var(--border)}
.x-btn{border:none;background:var(--oops-soft);border-radius:50%;width:32px;height:32px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* 단어 목록 */
.wlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wlist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--bg1);border:2px solid var(--border);flex-wrap:wrap}
.wlist .em{font-size:1.6rem;flex:none;width:40px;text-align:center}
.thumb{width:40px;height:40px;object-fit:cover;border-radius:10px;display:block}
.wlist .en{font-family:var(--head);font-size:1.2rem}
.wlist .ko{color:var(--muted)}
.wlist .grow{flex:1;min-width:120px}
.li-btns{display:flex;gap:6px;margin-left:auto}
.badge{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:999px;font-family:var(--head);white-space:nowrap}
.badge.admin{background:var(--sky-soft)}
.badge.child{background:var(--pink-soft)}
.badge.bonus{background:var(--sun-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--purple-soft);border-radius:999px;padding:4px 12px;font-family:var(--head)}
.speak{border:none;background:var(--sky-soft);border-radius:50%;width:40px;height:40px;font-size:1.1rem;flex:none;vertical-align:middle}

/* 그림 */
img.pic{display:block;margin:0 auto 8px;object-fit:cover;border-radius:24px;width:160px;height:160px;border:4px solid var(--card);box-shadow:0 0 0 3px var(--purple-soft)}
img.pic.sm{width:110px;height:110px;border-radius:18px}
img.pic.mpic{width:52px;height:52px;border-radius:12px;border-width:2px;box-shadow:none;margin-bottom:2px}

/* 단어 카드 */
.wcard{text-align:center;padding:26px 18px}
.wcard .emoji{font-size:5.5rem;line-height:1.1;display:block}
.wcard .en{font-family:var(--head);font-size:3rem;color:var(--purple);margin:6px 0 0;word-break:break-word}
.wcard .ko{font-family:var(--head);font-size:1.6rem;margin-bottom:14px}
.example{background:var(--bg1);border-radius:18px;padding:12px 14px;font-size:1.15rem}
.example b{color:var(--pink)}
.dots{display:flex;justify-content:center;gap:8px;margin:4px 0 14px}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--purple-soft)}
.dots span.on{background:var(--pink)}

/* 게임 공통 */
.game-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--head);background:var(--purple-soft);padding:4px 12px;border-radius:999px}
.q-card{text-align:center;padding:24px 18px}
.q-word{font-family:var(--head);font-size:2.8rem;color:var(--purple);display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;word-break:break-word}
.q-word.ko{color:var(--text);font-size:2.1rem}
.q-emoji{font-size:5.5rem;line-height:1.15;display:block}
.q-emoji.sm{font-size:3.6rem}
.q-sub{color:var(--muted);font-size:1.05rem;margin-top:6px}
.q-sentence{font-family:var(--head);font-size:1.7rem;line-height:1.5}
.blank{display:inline-block;min-width:90px;border-bottom:4px dashed var(--pink);color:var(--pink)}
.big-speak{font-size:3.4rem;width:120px;height:120px;border-radius:50%;border:none;background:var(--sky-soft);box-shadow:0 6px 0 var(--sky)}
.big-speak:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky)}
.opts{display:grid;gap:12px;margin-top:4px}
.opt{font-family:var(--head);font-size:1.5rem;padding:16px;border-radius:20px;border:3px solid var(--border);background:var(--card);box-shadow:0 4px 0 var(--border);transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--mint-soft);border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.opt.wrong{background:var(--oops-soft);border-color:var(--oops);opacity:.65;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.next-wrap{margin-top:16px;display:none}
.next-wrap.show{display:block;animation:pop .3s}

/* 철자 섞기, 빠진 글자 */
.slots,.mword{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:18px 0}
.slot{width:44px;height:56px;border-radius:12px;border:3px dashed var(--border);display:grid;place-items:center;font-family:var(--head);font-size:1.8rem;background:var(--bg1)}
.slot.fill{border-style:solid;border-color:var(--purple)}
.slot.lock{border-color:var(--sun);background:var(--sun-soft)}
.slots.right .slot{border-color:var(--mint);background:var(--mint-soft)}
.slots.reveal .slot{border-color:var(--sky);background:var(--sky-soft)}
.slots.shake,.mword.shake{animation:shake .35s}
.ml{font-family:var(--head);font-size:2.2rem;min-width:40px;height:58px;display:grid;place-items:center;color:var(--purple)}
.ml.hole{border:3px dashed var(--pink);border-radius:12px;background:var(--bg1);color:var(--muted);padding:0 6px}
.ml.hole.fill{border-style:solid;color:var(--text)}
.ml.hole.lock{border-color:var(--sun);background:var(--sun-soft)}
.mword.right .ml.hole{border-color:var(--mint);background:var(--mint-soft)}
.ml.hole.rev{border-color:var(--sky);background:var(--sky-soft);color:var(--text)}
.tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tile{width:56px;height:56px;border-radius:16px;border:none;background:var(--pink-soft);box-shadow:0 4px 0 var(--pink);font-family:var(--head);font-size:1.8rem}
.tile:disabled{opacity:.25;box-shadow:none}

/* 짝꿍 카드 */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mcard{aspect-ratio:3/4;border-radius:18px;border:3px solid var(--border);background:linear-gradient(135deg,var(--pink-soft),var(--purple-soft));padding:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 4px 0 var(--border);min-width:0}
.mcard .mface{display:none;flex-direction:column;align-items:center;gap:2px;width:100%;min-width:0}
.mcard .mback{font-size:2rem}
.mcard.open,.mcard.match{background:var(--card);animation:flip .28s}
.mcard.open .mback,.mcard.match .mback{display:none}
.mcard.open .mface,.mcard.match .mface{display:flex}
.mcard.match{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 4px 0 var(--mint)}
.men{font-family:var(--head);font-size:clamp(.85rem,3.4vw,1.25rem);word-break:break-word;text-align:center;line-height:1.2}
.mko{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.2;word-break:keep-all}
.mpic{font-size:2.1rem;line-height:1.1;display:block}
@keyframes flip{0%{transform:scaleX(.15)}100%{transform:scaleX(1)}}

/* 풍선 */
.sky-box{position:relative;height:380px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--sky-soft),var(--card));border:2px solid var(--border)}
.balloon{position:absolute;bottom:-190px;width:min(23%,118px);border:none;background:none;padding:0;animation:bal linear infinite;transform:translateX(-50%)}
.bshape{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:5/6;border-radius:50% 50% 46% 46%/55% 55% 45% 45%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.8) 0 9%,transparent 10%),var(--c);box-shadow:inset -8px -10px 0 rgba(0,0,0,.08);transition:transform .25s,opacity .25s}
.bshape::before{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.bshape::after{content:"";position:absolute;bottom:-40px;left:50%;width:2px;height:34px;background:var(--muted);opacity:.6}
.btxt{font-family:var(--head);font-size:clamp(.85rem,3.4vw,1.15rem);color:#4a3757;padding:0 4px;word-break:break-word;line-height:1.15}
.balloon.popped .bshape{transform:scale(1.7);opacity:0}
.balloon.deflate .bshape{transform:scale(.3);opacity:0}
.balloon.glow .bshape{box-shadow:0 0 0 5px #fff,0 0 26px 10px var(--mint)}
@keyframes bal{0%{transform:translate(-50%,0)}50%{transform:translate(calc(-50% + 12px),-300px)}100%{transform:translate(-50%,-600px)}}
.boom{position:absolute;font-family:var(--head);font-size:1.7rem;color:var(--pink);transform:translate(-50%,-50%);animation:pop .4s;pointer-events:none;white-space:nowrap}

/* 결과, 기록 */
.result-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:2px solid var(--border);border-radius:20px;padding:14px;text-align:center}
.stat .v{font-family:var(--head);font-size:1.6rem}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
th,td{text-align:left;padding:10px 8px;border-bottom:2px solid var(--border);vertical-align:top}
th{font-family:var(--head);font-weight:400;font-size:1rem}
td .badge{margin-right:4px}
.grow-row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.grow-row .gname{font-family:var(--head);width:130px}
.gbar{height:12px;background:var(--purple-soft);border-radius:999px;overflow:hidden;flex:1;min-width:80px}
.gbar>div{height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px}

/* 창 */
.overlay{position:fixed;inset:0;background:rgba(60,30,80,.38);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--card);border-radius:26px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;text-align:center;border:2px solid var(--border);animation:pop .3s}
.modal-ava{font-size:2.6rem}
.modal-body{font-size:1.12rem;margin:6px 0 16px}
.modal-body .input{margin-top:4px;text-align:left}
.modal-body label,.modal-body .label-like{text-align:left}
.modal-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.star-pop{position:fixed;font-size:2.4rem;pointer-events:none;z-index:60;animation:rise 1s ease-out forwards}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}25%{opacity:1;transform:translate(-50%,-20px) scale(1.25)}100%{transform:translate(-50%,-120px) scale(1);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 18px;border-radius:999px;z-index:70;font-size:1rem;animation:pop .3s;max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (max-width:520px){
  body{font-size:16px}
  .grid2{grid-template-columns:1fr}
  .logo span{font-size:2.4rem}
  .wcard .en,.q-word{font-size:2.4rem}
  .slot{width:38px;height:50px;font-size:1.5rem}
  .tile{width:50px;height:50px}
  .mgrid{grid-template-columns:repeat(4,1fr);gap:8px}

function normWord(w){
  if(!w) return w;
  if(!Array.isArray(w.emojis)) w.emojis=w.emoji?[w.emoji]:[];
  const d=DICT_MAP[w.en];
  if(d&&w.emojis.length<=1&&(!w.emojis.length||d.emojis.includes(w.emojis[0]))) w.emojis=[...d.emojis];
  if(!w.emojis.length) w.emojis=['✨'];
  delete w.emoji; w.img=w.img||'';
  return w;
}
function loadState(){
  let s=null;
  try{const raw=localStorage.getItem(KEY); if(raw) s=JSON.parse(raw);}catch(e){}
  if(!s && memStore[KEY]) s=memStore[KEY];
  s=Object.assign(defaultState(), s||{});
  s.adminQueue.forEach(normWord);s.childQueue.forEach(normWord);
  if(s.today) s.today.words.forEach(normWord);
  Object.values(s.wordBook).forEach(normWord);
  return s;
}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uniq=a=>[...new Set(a)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayStr=()=>dstr(new Date());
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d);};
const todayObj=()=>S.today && S.today.date===todayStr()?S.today:null;
const nm=()=>S.childName?`${esc(S.childName)} 탐험가님`:'탐험가님';
function titleOf(s){let t='꼬마 탐험가 🎒';TITLES.forEach(x=>{if(s>=x.n)t=x.t;});return t;}
function nextTitle(s){return TITLES.find(x=>x.n>s)||null;}
function prevN(s){let n=0;TITLES.forEach(x=>{if(s>=x.n)n=x.n;});return n;}
function curStreak(){return (S.lastStudy===todayStr()||S.lastStudy===yesterdayStr())?S.streak:0;}
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function suggest(en){
  if(en.length<3) return null;
  const maxd=en.length<=4?1:2; let best=null,bd=99;
  DICT.forEach(w=>{const d=lev(en,w.en); if(d<=maxd && d<bd){best=w;bd=d;}});
  return best;
}
function splitEmojis(s){
  s=String(s||'').trim(); if(!s) return [];
  let parts;
  if(window.Intl&&Intl.Segmenter) parts=[...new Intl.Segmenter().segment(s)].map(x=>x.segment);
  else parts=s.split(/[\s,]+/);
  return parts.filter(g=>g.trim()&&g!==',').slice(0,3);
}
const reRx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function wordRx(en){return new RegExp('\\b'+reRx(en)+'\\b','i');}
function hasEx(w){return !!(w.ex && wordRx(w.en).test(w.ex));}
function blankOf(w){return hasEx(w)?w.ex.replace(wordRx(w.en),'_____'):'I like _____.';}
const emo0=w=>(w.emojis&&w.emojis[0])||'✨';
const emoR=w=>pick(w.emojis&&w.emojis.length?w.emojis:['✨']);
const hasPicture=w=>!!w.img||(w.emojis||[]).some(e=>e!=='✨');
function picHtml(w,cls,e){
  if(w.img) return `<img class="pic ${cls.includes('sm')?'sm':''} ${cls.includes('mpic')?'mpic':''}" src="${w.img}" alt="${esc(w.en)} 사진">`;
  return `<span class="${cls}" aria-hidden="true">${e||emoR(w)}</span>`;
}
const thumb=w=>w.img?`<img class="thumb" src="${w.img}" alt="">`:emo0(w);
function srcLabel(src,adult){
  if(adult) return {admin:'운영자',child:'아이',bonus:'루시 보너스'}[src];
  return {admin:'🎁 선물 단어',child:'💖 내가 고른 단어',bonus:'✨ 루시가 고른 보너스 단어'}[src];
}
const badge=(src,adult)=>`<span class="badge ${src}">${srcLabel(src,adult)}</span>`;
const theme=()=>THEMES[(S.today&&S.today.theme!=null)?S.today.theme:0];

function render(html){app.innerHTML=html;window.scrollTo(0,0);}
function lucy(text,mood='hi'){return `<div class="lucy"><div class="lucy-ava" id="lucyAva" aria-hidden="true">${MOODS[mood]||MOODS.hi}</div><div class="bubble" id="lucyBubble">${text}</div></div>`;}

  b.innerHTML=text;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function applyPlace(on){

function modal({title='',body='',buttons=[{label:'확인',value:true,cls:'pink'}],ava='hi'}){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='overlay';
    ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${ava?`<div class="modal-ava">${MOODS[ava]||ava}</div>`:''}${title?`<h3>${title}</h3>`:''}<div class="modal-body">${body}</div><div class="modal-btns">${buttons.map((b,i)=>`<button class="btn sm ${b.cls||'ghost'}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;

      const data={};ov.querySelectorAll('[data-field]').forEach(el=>data[el.dataset.field]=el.value);

function photoField(pid,current){
  return `<div class="photo-field">
    <input type="hidden" id="${pid}" data-field="img" value="${esc(current||'')}">
    <label class="btn ghost sm photo-btn">📷 사진 올리기<input type="file" accept="image/*" hidden onchange="onPhoto(this,'${pid}')"></label>
    <div class="photo-prev" id="${pid}-prev">${current?photoPrev(pid,current):''}</div>
  </div>`;
}
const photoPrev=(pid,src)=>`<img src="${src}" alt="올린 사진"><button type="button" class="x-btn" onclick="clearPhoto('${pid}')" aria-label="사진 빼기">✕</button>`;
function readImage(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)) return rej(new Error('not image'));
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      const m=240,sc=Math.min(1,m/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.82));
    };im.onerror=rej;im.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
async function onPhoto(input,pid){
  try{
    const url=await readImage(input.files[0]);
    document.getElementById(pid).value=url;
    document.getElementById(pid+'-prev').innerHTML=photoPrev(pid,url);
  }catch(e){alertBox('사진을 불러오지 못했어요. 다른 사진으로 해볼까요? 📷');}
  input.value='';
}
function clearPhoto(pid){document.getElementById(pid).value='';document.getElementById(pid+'-prev').innerHTML='';}

const canSpeak='speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
let enVoice=null;
function loadVoices(){
  if(!canSpeak) return;
  const vs=speechSynthesis.getVoices();
  enVoice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/samantha|google us|female|zira|aria|jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function speak(t){
  if(!canSpeak){toast('이 기기에서는 소리 기능을 쓸 수 없어요 🙈');return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;if(enVoice)u.voice=enVoice;speechSynthesis.speak(u);}catch(e){}
}

/* 색종이 */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const colors=['#f06fa4','#9b6ce8','#4fa9e6','#f5b93a','#38b886','#ffb3d1'];
  const ps=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:6+Math.random()*6,h:8+Math.random()*8,vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.15+Math.random()*.3,c:pick(colors)}));
  const start=performance.now();
  (function frame(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(t-start<3500) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  })(start);
}

/* ===================== 단어 넣기 ===================== */
function isDuplicate(en,exceptId){
  const t=todayObj();const hit=w=>w.en===en&&w.id!==exceptId;
  return S.adminQueue.some(hit)||S.childQueue.some(hit)||(t&&!t.done&&t.words.some(hit));
}
function listFor(q){
  if(q==='admin') return S.adminQueue;
  if(q==='child') return S.childQueue;
  const t=todayObj(); return t&&!t.done?t.words:[];
}
async function checkEn(raw,kid){
  let en=String(raw||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/’/g,"'");
  if(!en){await alertBox(kid?'영어 단어를 적어주세요 😊':'영어 단어를 넣어주세요.');return null;}
  if(!/^[a-z][a-z '\-]*$/.test(en)){await alertBox(`‘${esc(en)}’ 안에 영어 알파벳이 아닌 글자가 있어요. 영어로만 적어주세요 🔤`);return null;}
  return en;
}
async function askSpelling(en){
  if(DICT_MAP[en]) return en;
  const sug=suggest(en);
  if(sug&&sug.en!==en){
    const yes=await confirmBox(`혹시 ‘${esc(en)}’이 ‘${sug.en}’(${sug.ko}) 맞나요? ${sug.emojis[0]}`,'네, 맞아요!','아니요, 그대로 둘래요');
    if(yes) return sug.en;
  }
  return en;
}
async function prepareWord(input,source){
  const kid=source==='child';
  let en=await checkEn(input.en,kid); if(!en) return null;
  en=await askSpelling(en);
  const d=DICT_MAP[en];
  const ko=String(input.ko||'').trim()||(d?d.ko:'');
  if(!ko){await alertBox(kid?`‘${esc(en)}’의 한글 뜻도 적어주세요! 📝`:`‘${esc(en)}’의 한글 뜻을 넣어주세요. 내장 단어장에 없는 단어예요.`);return null;}
  if(isDuplicate(en)){await alertBox(`‘${esc(en)}’은(는) 이미 단어 주머니에 있어요 🎒`);return null;}
  const ex=String(input.ex||'').trim();
  let emojis=splitEmojis(input.emoji);
  if(!emojis.length) emojis=d?[...d.emojis]:['✨'];
  return {id:uid(),en,ko,emojis,img:input.img||'',ex:ex||(d?d.ex:''),exKo:ex?'':(d?d.exKo:''),source};
}

function goWords(tab){

async function addChildWord(){
  const g=id=>document.getElementById(id).value;
  const w=await prepareWord({en:g('cEn'),ko:g('cKo'),emoji:g('cEmo'),img:g('cImg')},'child');
  if(!w) return;
  S.childQueue.push(w);
  const td=todayStr();
  if(S.bonus.date!==td) S.bonus={date:td,count:0};
  let gotStar=false;
  if(S.bonus.count<5){S.bonus.count++;gotStar=true;}
  save();goWords('child');
  if(gotStar){
    setLucy(`와, 스스로 단어를 골랐네요! ⭐ 보너스 별 1개!<br>‘${esc(w.en)}’(${esc(w.ko)}) ${w.img?'📷':emo0(w)} 은(는) 다음 모험에 나와요.<br><span class="small">잘못 넣었다면 아래에서 ✏️ 고치기를 눌러요.</span>`,'praise');
    giveStar(document.querySelector('.btn.xl'));
  }else{
    setLucy(`멋진 단어예요! ‘${esc(w.en)}’을(를) 단어 주머니에 넣었어요.<br>오늘 보너스 별은 다 받았지만, 단어는 얼마든지 넣을 수 있어요 💖`,'praise');
  }
}

async function addAdminWord(){
  const g=id=>document.getElementById(id).value;
  const w=await prepareWord({en:g('aEn'),ko:g('aKo'),emoji:g('aEm'),ex:g('aEx'),img:g('aImg')},'admin');
  if(!w) return;
  S.adminQueue.push(w);save();goWords('admin');toast(`‘${w.en}’을(를) 단어 주머니에 넣었어요`);
}
async function addBulk(){
  const lines=document.getElementById('bulk').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){await alertBox('넣을 단어를 한 줄에 하나씩 적어주세요.');return;}
  let added=0;
  for(const line of lines){
    const p=line.split(/[,，\t]/);
    const w=await prepareWord({en:p[0],ko:p[1],emoji:p[2],ex:p.slice(3).join(',')},'admin');
    if(w){S.adminQueue.push(w);added++;save();}
  }
  goWords('admin');
  await alertBox(`${added}개 단어를 단어 주머니에 넣었어요.${added<lines.length?`<br><span class="muted small">${lines.length-added}개는 넣지 못했어요.</span>`:''}`);
}

async function editWord(q,id,who='admin',draft=null){

  const dv=f=>draft&&draft[f]!==undefined?draft[f]:null;
  const v=(f,fallback)=>esc(dv(f)??fallback);
  const curEmo=dv('emoji')??(kid?emo0(w):w.emojis.join(' '));
  const curImg=dv('img')??w.img;
  const body=kid?`
    <label>영어 단어</label><input class="input big" data-field="en" value="${v('en',w.en)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>한글 뜻</label><input class="input big" data-field="ko" value="${v('ko',w.ko)}" autocomplete="off">
    <div class="label-like">그림 <span class="sel-emo" id="mEmo-sel">${esc(curEmo)}</span></div>
    ${picker('mEmo',curEmo)}
    <div class="label-like">내 사진</div>
    ${photoField('mImg',curImg)}`
    :`
    <label>영어 단어</label><input class="input" data-field="en" value="${v('en',w.en)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>한글 뜻</label><input class="input" data-field="ko" value="${v('ko',w.ko)}" autocomplete="off">
    <label>이모지 (3개까지)</label><input class="input" data-field="emoji" value="${esc(curEmo)}" autocomplete="off">
    <label>예문</label><input class="input" data-field="ex" value="${v('ex',w.ex)}" autocomplete="off">
    <div class="label-like">사진</div>
    ${photoField('mImg',curImg)}
    <p class="muted small" style="text-align:left">뜻·이모지·예문을 비우면 내장 단어장에서 자동으로 채워져요.</p>`;
  const r=await modal({ava:kid?'hi':'',title:kid?'단어 고치기 ✏️':'단어 수정',body,
    buttons:[{label:'취소',value:false},{label:kid?'다 고쳤어요!':'저장',value:true,cls:kid?'pink':'purple'}]});
  if(!r.value) return;
  const before=w.en;
  const ok=await applyEdit(w,r.data,kid);
  if(!ok) return editWord(q,id,who,r.data);
  save();
  if(kid){goWords('child');setLucy(`잘 고쳤어요! ✨ ${w.img?'📷':emo0(w)} ‘${esc(w.en)}’(${esc(w.ko)})${before!==w.en?`<br><span class="small">‘${esc(before)}’ → ‘${esc(w.en)}’</span>`:''}`,'praise');}
  else{goWords('admin');toast(`‘${w.en}’ 단어를 고쳤어요`);}
}
async function applyEdit(w,data,kid){
  let en=await checkEn(data.en,kid); if(!en) return false;
  if(en!==w.en) en=await askSpelling(en);
  if(isDuplicate(en,w.id)){await alertBox(`‘${esc(en)}’은(는) 이미 단어 주머니에 있어요 🎒`);return false;}
  const d=DICT_MAP[en],old=DICT_MAP[w.en],changed=en!==w.en;
  let ko=String(data.ko||'').trim();
  if(changed&&old&&ko===old.ko) ko='';
  ko=ko||(d?d.ko:'');
  if(!ko){await alertBox(kid?`‘${esc(en)}’의 한글 뜻도 적어주세요! 📝`:`‘${esc(en)}’의 한글 뜻을 넣어주세요. 내장 단어장에 없는 단어예요.`);return false;}
  let ex=data.ex!==undefined?String(data.ex).trim():w.ex, exKo=w.exKo;
  if(changed&&ex===w.ex&&(!old||ex===old.ex)){ex='';exKo='';}
  else if(ex!==w.ex) exKo='';
  if(!ex&&d){ex=d.ex;exKo=d.exKo;}
  let es=splitEmojis(data.emoji);
  if(changed&&old&&es.length&&es.every(e=>old.emojis.includes(e))) es=[];
  else if(!changed&&es.length===1&&w.emojis.includes(es[0])) es=[...w.emojis];
  if(!es.length) es=d?[...d.emojis]:['✨'];
  Object.assign(w,{en,ko,emojis:es,img:data.img||'',ex,exKo});
  return true;
}

/* ===================== 모험 ===================== */
function buildToday(){
  if(todayObj()){ if(S.today.theme==null){S.today.theme=Math.floor(Date.now()/864e5)%THEMES.length;save();} return; }
  const words=[];
  while(words.length<5&&S.adminQueue.length) words.push(S.adminQueue.shift());
  while(words.length<5&&S.childQueue.length) words.push(S.childQueue.shift());
  if(words.length<5){
    const used=new Set(words.map(w=>w.en));
    let cand=DICT.filter(d=>!S.wordBook[d.en]&&!used.has(d.en));
    if(cand.length<5-words.length) cand=DICT.filter(d=>!used.has(d.en));
    shuffle(cand).slice(0,5-words.length).forEach(d=>words.push({id:uid(),en:d.en,ko:d.ko,emojis:[...d.emojis],img:'',ex:d.ex,exKo:d.exKo,source:'bonus'}));
  }
  S.today={date:todayStr(),words,done:false,theme:Math.floor(Date.now()/864e5)%THEMES.length};save();
}
function pickGames(){
  const types=Object.keys(GAME_INFO).filter(t=>t!=='listen'||canSpeak);
  return shuffle(types).slice(0,4);
}
function buildReview(){
  const todaySet=new Set(S.today.words.map(w=>w.en));
  const list=[];
  Object.entries(S.wrong).filter(([en,c])=>c>0&&S.wordBook[en]&&!todaySet.has(en)).sort((a,b)=>b[1]-a[1]).forEach(([en])=>list.push(en));
  const last=[...S.history].reverse().find(h=>h.date!==todayStr());
  if(last) shuffle(last.words.map(w=>w.en)).forEach(en=>{if(S.wordBook[en]&&!todaySet.has(en))list.push(en);});
  return uniq(list).slice(0,3).map(en=>S.wordBook[en]);
}

async function startAdventure(){
  buildToday();
  const t=S.today;
  if(t.done){
    const ok=await confirmBox('오늘 모험은 이미 완료했어요! 🎉<br>같은 단어로 한 번 더 연습할까요?','한 번 더!','다음에 할래요');
    if(!ok) return;
  }
  const games=pickGames();
  const review=buildReview();
  const reviewQs=review.map((w,i)=>({type:hasPicture(w)?pick(['meaning','emoji']):'meaning',word:w,phase:'review',qNo:i,total:review.length}));
  const gameQs=[];
  games.forEach((g,gi)=>{
    if(g==='memory') gameQs.push({type:g,word:null,phase:'game',gameNo:gi,qNo:0,total:1});
    else shuffle(t.words).forEach((w,qi)=>gameQs.push({type:g,word:w,phase:'game',gameNo:gi,qNo:qi,total:t.words.length}));
  });
  session={words:t.words,games,reviewQs,gameQs,phase:reviewQs.length?'review':'game',qi:0,earned:0,treasure:0,wrongSet:new Set(),attempts:0,locked:false,opts:[]};
  applyPlace(true);
  if(reviewQs.length) showReviewIntro(); else showToday();
}

/* ===================== 게임 공통 ===================== */
function curQ(){return (session.phase==='review'?session.reviewQs:session.gameQs)[session.qi];}

function renderQuestion(){
  const q=curQ();
  session.attempts=0;session.locked=false;
  const arr=session.phase==='review'?session.reviewQs:session.gameQs;
  const isLast=session.qi===arr.length-1;
  const info=GAME_INFO[q.type];
  const head=`${topBar()}
    <div class="game-head"><span class="tag">${q.phase==='review'?'복습 퀴즈 🔍':`게임 ${q.gameNo+1}/${session.games.length} · ${info.name}`}</span><span class="muted">${q.type==='memory'?'한 판':`문제 ${q.qNo+1}/${q.total}`}</span></div>
    <div class="progress"><div style="width:${Math.round(session.qi/arr.length*100)}%"></div></div>`;
  const first=q.qNo===0;
  const intro=q.phase==='review'?(first?'지난번에 배운 단어예요. 기억나나요?':pick(CHEER)):(first?info.how:pick(CHEER));
  const mood=q.phase==='review'&&first?'hint':'hi';
  const nextLabel=isLast?(session.phase==='review'?'오늘의 모험 출발! 🚀':'결과 보기 🎉'):'다음 ➡';
  const nextWrap=`<div class="next-wrap" id="nextWrap"><button class="btn xl" onclick="nextQuestion()">${nextLabel}</button></div>`;
  const p={head,intro,mood,nextWrap};
  if(q.type==='scramble') return renderScramble(q,p);
  if(q.type==='memory') return renderMemory(q,p);
  if(q.type==='balloon') return renderBalloon(q,p);
  if(q.type==='missing') return renderMissing(q,p);
  renderChoice(q,p);
}

function makeOpts(w,field,n){
  const correct=w[field];
  const others=shuffle(session.words.filter(x=>x.en!==w.en).map(x=>x[field]));
  const dict=shuffle(DICT.map(x=>x[field]));
  const dis=uniq([...others,...dict].filter(v=>v&&v.toLowerCase()!==correct.toLowerCase())).slice(0,n-1);
  return shuffle([{label:correct,correct:true},...dis.map(v=>({label:v,correct:false}))]);
}

function markWrong(w){S.wrong[w.en]=(S.wrong[w.en]||0)+1;session.wrongSet.add(w.en);save();}
function onCorrect(el){
  const q=curQ(),w=q.word;
  session.earned++;
  if(q.phase==='review'&&session.attempts===0&&S.wrong[w.en]){S.wrong[w.en]--;if(S.wrong[w.en]<=0)delete S.wrong[w.en];}
  if(q.phase==='game') recordStat(q.type,session.attempts===0);
  giveStar(el);giveTreasure(el);
  setLucy(pick(PRAISE)+(session.attempts?'<br>힌트를 잘 활용했어요! 👍':''),'praise');
  speak(w.en);showNext();
}
function onFinalWrong(){
  const q=curQ(),w=q.word;
  if(q.phase==='game') recordStat(q.type,false);
  setLucy(`정답은 <b>${esc(w.en)}</b> (${esc(w.ko)})예요.<br>괜찮아요, 다음엔 꼭 맞힐 거예요! 💪`,'cheer');
  speak(w.en);showNext();
}
function hintText(q){
  const w=q.word;
  if(q.type==='meaning') return `앗, 아쉬워요! 힌트를 줄게요 💡<br>뜻의 첫 글자는 ‘${[...w.ko][0]}’예요.`;
  if(q.type==='listen'){speak(w.en);return `앗, 아쉬워요! 소리를 한 번 더 들려줄게요 💡<br>첫 글자는 ‘${w.en[0]}’예요.`;}
  return `앗, 아쉬워요! 힌트를 줄게요 💡<br>첫 글자는 ‘${w.en[0]}’예요.`;
}
function showNext(){const n=document.getElementById('nextWrap');if(n){n.classList.add('show');setTimeout(()=>n.scrollIntoView&&n.scrollIntoView({behavior:'smooth',block:'nearest'}),100);}}
function nextQuestion(){
  if(canSpeak) try{speechSynthesis.cancel();}catch(e){}
  session.qi++;
  const arr=session.phase==='review'?session.reviewQs:session.gameQs;
  if(session.qi>=arr.length){ if(session.phase==='review') showToday(); else finish(); }
  else renderQuestion();
}

/* 고르기형: 뜻 맞히기, 빈칸, 이모지, 듣기 */
function renderChoice(q,p){
  const w=q.word;
  session.opts=makeOpts(w,q.type==='meaning'?'ko':'en',3);
  let prompt='';
  if(q.type==='meaning'){
    prompt=`<div class="q-word">${esc(w.en)} ${speakBtn(w.en)}</div><p class="q-sub">이 단어의 뜻은 무엇일까요?</p>`;
  }else if(q.type==='blank'){
    const s=esc(blankOf(w)).replace('_____','<span class="blank">?</span>');
    prompt=`${picHtml(w,'q-emoji sm',emoR(w))}<div class="q-sentence">${s}</div><p class="q-sub">${hasEx(w)&&w.exKo?esc(w.exKo):`빈칸에 ‘${esc(w.ko)}’을(를) 영어로 넣어요`}</p>`;
  }else if(q.type==='emoji'){
    prompt=hasPicture(w)?`${picHtml(w,'q-emoji',emoR(w))}<p class="q-sub">이 그림은 영어로 무엇일까요?</p>`:`<div class="q-word ko">${esc(w.ko)}</div><p class="q-sub">이 뜻을 영어로 하면 무엇일까요?</p>`;
  }else if(q.type==='listen'){
    prompt=`<button class="big-speak" data-say="${esc(w.en)}" onclick="speak(this.dataset.say)" aria-label="소리 듣기">🔊</button><p class="q-sub">소리를 잘 듣고 맞는 단어를 골라요. 여러 번 들어도 돼요!</p>`;
  }
  render(`${p.head}${lucy(p.intro,p.mood)}
    <div class="card q-card">${prompt}</div>
    <div class="opts">${session.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="choose(${i})">${esc(o.label)}</button>`).join('')}</div>
    ${p.nextWrap}`);
  if(q.type==='listen') setTimeout(()=>speak(w.en),350);
}
function choose(i){
  if(session.locked) return;
  const o=session.opts[i],btn=document.querySelector(`.opt[data-i="${i}"]`),q=curQ();
  if(o.correct){
    session.locked=true;btn.classList.add('right');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    onCorrect(btn);
  }else{
    session.attempts++;btn.classList.add('wrong');btn.disabled=true;
    if(session.attempts===1){markWrong(q.word);setLucy(hintText(q),'hint');}
    else{
      session.locked=true;
      document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(session.opts[k].correct)b.classList.add('right');});
      onFinalWrong();
    }
  }
}

/* 철자 섞기 */
function renderScramble(q,p){
  const w=q.word,target=w.en.replace(/[^a-z]/g,'');
  let tiles=target.split('');
  for(let k=0;k<12;k++){tiles=shuffle(tiles);if(tiles.join('')!==target||target.length<2)break;}
  session.sc={target,tiles,picked:[],locked:0,reveal:false};
  render(`${p.head}${lucy(p.intro,p.mood)}
    <div class="card q-card">
      ${picHtml(w,'q-emoji sm',emoR(w))}
      <div class="q-sub" style="font-size:1.25rem"><b>${esc(w.ko)}</b> — 알파벳을 순서대로 눌러요</div>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <button class="btn ghost sm" onclick="scUndo()">⬅ 하나 지우기</button>
    </div>${p.nextWrap}`);
  drawSc();
}
function drawSc(){
  const sc=session.sc;
  document.getElementById('slots').innerHTML=sc.target.split('').map((ch,i)=>{
    const letter=sc.reveal?ch:(sc.picked[i]!=null?sc.tiles[sc.picked[i]]:'');
    return `<div class="slot ${letter?'fill':''} ${i<sc.locked&&!sc.reveal?'lock':''}">${letter}</div>`;
  }).join('');
  document.getElementById('tiles').innerHTML=sc.tiles.map((ch,i)=>`<button class="tile" onclick="scTap(${i})" ${sc.picked.includes(i)||session.locked?'disabled':''}>${ch}</button>`).join('');
}
function scTap(i){const sc=session.sc;if(session.locked||sc.picked.includes(i))return;sc.picked.push(i);drawSc();if(sc.picked.length===sc.target.length)scCheck();}
function scUndo(){const sc=session.sc;if(session.locked)return;if(sc.picked.length>sc.locked){sc.picked.pop();drawSc();}}
function scCheck(){
  const sc=session.sc,q=curQ(),slots=document.getElementById('slots');
  if(sc.picked.map(i=>sc.tiles[i]).join('')===sc.target){
    session.locked=true;drawSc();document.getElementById('slots').classList.add('right');
    onCorrect(document.getElementById('slots'));return;
  }
  session.attempts++;
  slots.classList.remove('shake');void slots.offsetWidth;slots.classList.add('shake');
  if(session.attempts===1){
    markWrong(q.word);
    setLucy(`앗, 아쉬워요! 첫 글자는 ‘${sc.target[0]}’예요.<br>루시가 첫 글자를 먼저 넣어 둘게요 💡`,'hint');
    setTimeout(()=>{sc.picked=[sc.tiles.indexOf(sc.target[0])];sc.locked=1;drawSc();},600);
  }else{
    session.locked=true;
    setTimeout(()=>{sc.reveal=true;drawSc();document.getElementById('slots').classList.add('reveal');onFinalWrong();},500);
  }
}

/* 짝꿍 카드 뒤집기 */
function renderMemory(q,p){
  const cards=shuffle([...session.words.map(w=>({k:w.id,t:'en',w})),...session.words.map(w=>({k:w.id,t:'pic',w,e:emoR(w)}))]);
  session.mm={cards,open:[],done:new Set(),miss:0,busy:false};
  render(`${p.head}${lucy(p.intro,p.mood)}
    <div class="mgrid">${cards.map((c,i)=>`<button class="mcard" data-i="${i}" onclick="mmFlip(${i})" aria-label="카드 ${i+1}">
      <span class="mback" aria-hidden="true">${theme().tr}</span>
      <span class="mface">${c.t==='en'?`<span class="men">${esc(c.w.en)}</span>`:`${picHtml(c.w,'mpic',c.e)}<span class="mko">${esc(c.w.ko)}</span>`}</span>
    </button>`).join('')}</div>${p.nextWrap}`);
}
function mmCard(i){return document.querySelector(`.mcard[data-i="${i}"]`);}
function mmFlip(i){
  const m=session.mm,c=m.cards[i];
  if(m.busy||m.open.includes(i)||m.done.has(c.k)) return;
  const el=mmCard(i);el.classList.add('open');m.open.push(i);
  if(c.t==='en') speak(c.w.en);
  if(m.open.length<2) return;
  const [a,b]=m.open,A=m.cards[a],B=m.cards[b];
  if(A.k===B.k){
    m.done.add(A.k);m.open=[];
    [a,b].forEach(j=>mmCard(j).classList.add('match'));
    session.earned++;recordStat('memory',true);giveStar(el);giveTreasure(el);
    if(m.done.size===session.words.length){setLucy('짝꿍을 모두 찾았어요! 기억력 대장이에요 🎉','party');showNext();}
    else setLucy(`${pick(PRAISE)}<br>‘${esc(A.w.en)}’은(는) ${esc(A.w.ko)}!`,'praise');
  }else{
    m.miss++;recordStat('memory',false);m.busy=true;
    const peek=m.miss%4===0;
    setLucy(peek?'루시가 남은 카드를 잠깐 보여줄게요! 잘 기억해 둬요 👀':pick(['아쉬워요! 카드 자리를 기억해 둬요 🤗','괜찮아요, 다시 찾아봐요! 🤗','거의 다 왔어요! 🤗']),peek?'hint':'cheer');
    setTimeout(()=>{
      [a,b].forEach(j=>mmCard(j).classList.remove('open'));m.open=[];
      if(peek){
        const rest=[...document.querySelectorAll('.mcard')].filter(x=>!x.classList.contains('match'));
        rest.forEach(x=>x.classList.add('open'));
        setTimeout(()=>{rest.forEach(x=>x.classList.remove('open'));m.busy=false;},1400);
      }else m.busy=false;
    },900);
  }
}

/* 풍선 터뜨리기 */
function renderBalloon(q,p){
  const w=q.word;
  session.opts=makeOpts(w,'en',4);
  const n=session.opts.length,lane=100/n,cols=shuffle(BCOLORS);
  render(`${p.head}${lucy(p.intro,p.mood)}
    <div class="card q-card" style="padding:16px">
      ${picHtml(w,'q-emoji sm',emoR(w))}
      <div class="q-word ko">${esc(w.ko)}</div>
      <p class="q-sub" style="margin:0">이 뜻의 영어 풍선을 터뜨려요!</p>
    </div>
    <div class="sky-box" id="skyBox">${session.opts.map((o,i)=>`<button class="balloon" data-i="${i}" style="left:${(i*lane+lane/2).toFixed(1)}%;--c:${cols[i%cols.length]};animation-duration:${(8+Math.random()*3).toFixed(1)}s;animation-delay:${(-(i*2.2+Math.random()*1.5)).toFixed(1)}s" onclick="popBalloon(${i})"><span class="bshape"><span class="btxt">${esc(o.label)}</span></span></button>`).join('')}</div>
    ${p.nextWrap}`);
}
function freeze(el){const t=getComputedStyle(el).transform;el.style.animation='none';el.style.transform=(t&&t!=='none')?t:'translateX(-50%)';}
function boom(el,text){
  const box=document.getElementById('skyBox');if(!box)return;
  const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();
  const s=document.createElement('span');s.className='boom';s.textContent=text;
  s.style.left=(r.left-b.left+r.width/2)+'px';s.style.top=(r.top-b.top+r.height/2)+'px';
  box.appendChild(s);setTimeout(()=>s.remove(),900);
}
function popBalloon(i){
  if(session.locked) return;
  const el=document.querySelector(`.balloon[data-i="${i}"]`),o=session.opts[i],q=curQ();
  if(o.correct){
    session.locked=true;freeze(el);boom(el,'펑! 💥');el.classList.add('popped');
    document.querySelectorAll('.balloon').forEach(b=>b.disabled=true);
    onCorrect(el);
  }else{
    session.attempts++;freeze(el);boom(el,'피슝~');el.classList.add('deflate');el.disabled=true;
    if(session.attempts===1){markWrong(q.word);setLucy(hintText(q),'hint');}
    else{
      session.locked=true;
      document.querySelectorAll('.balloon').forEach((b,k)=>{
        b.disabled=true;
        if(session.opts[k].correct){freeze(b);b.classList.add('glow');}
        else if(!b.classList.contains('deflate')){freeze(b);b.classList.add('deflate');}
      });
      onFinalWrong();
    }
  }
}

/* 빠진 글자 채우기 */
function renderMissing(q,p){
  const w=q.word,target=w.en.replace(/[^a-z]/g,'');
  const k=target.length<=4?1:2;
  const pos=shuffle([...Array(target.length).keys()]).slice(0,Math.min(k,target.length)).sort((a,b)=>a-b);
  const miss=pos.map(i=>target[i]);
  const extra=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!miss.includes(c))).slice(0,6-miss.length);
  session.ms={target,pos,miss,tiles:shuffle([...miss,...extra]),picked:[],locked:0,reveal:false};
  render(`${p.head}${lucy(p.intro,p.mood)}
    <div class="card q-card">
      ${picHtml(w,'q-emoji sm',emoR(w))}
      <div class="q-sub" style="font-size:1.25rem"><b>${esc(w.ko)}</b> ${speakBtn(w.en)}</div>
      <div class="mword" id="mword"></div>
      <div class="tiles" id="mtiles"></div>
      <button class="btn ghost sm" onclick="msUndo()">⬅ 하나 지우기</button>
    </div>${p.nextWrap}`);
  drawMs();
}
function drawMs(){
  const m=session.ms;
  document.getElementById('mword').innerHTML=m.target.split('').map((ch,i)=>{
    const bi=m.pos.indexOf(i);
    if(bi<0) return `<span class="ml">${ch}</span>`;
    const l=m.reveal?ch:(m.picked[bi]!=null?m.tiles[m.picked[bi]]:'');
    return `<span class="ml hole ${l?'fill':''} ${bi<m.locked&&!m.reveal?'lock':''} ${m.reveal?'rev':''}">${l||'?'}</span>`;
  }).join('');
  document.getElementById('mtiles').innerHTML=m.tiles.map((c,i)=>`<button class="tile" onclick="msTap(${i})" ${m.picked.includes(i)||session.locked?'disabled':''}>${c}</button>`).join('');
}
function msTap(i){const m=session.ms;if(session.locked||m.picked.includes(i))return;m.picked.push(i);drawMs();if(m.picked.length===m.pos.length)msCheck();}
function msUndo(){const m=session.ms;if(session.locked)return;if(m.picked.length>m.locked){m.picked.pop();drawMs();}}
function msCheck(){
  const m=session.ms,q=curQ(),box=document.getElementById('mword');
  if(m.picked.every((ti,bi)=>m.tiles[ti]===m.miss[bi])){
    session.locked=true;drawMs();document.getElementById('mword').classList.add('right');
    onCorrect(document.getElementById('mword'));return;
  }
  session.attempts++;
  box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
  if(session.attempts===1){
    markWrong(q.word);
    if(m.miss.length>1){
      setLucy(`앗, 아쉬워요! 첫 번째 빈칸은 ‘${m.miss[0]}’예요.<br>루시가 먼저 넣어 둘게요 💡`,'hint');
      setTimeout(()=>{m.picked=[m.tiles.indexOf(m.miss[0])];m.locked=1;drawMs();},600);
    }else{
      const vowel='aeiou'.includes(m.miss[0]);
      setLucy(`앗, 아쉬워요! 빠진 글자는 ${vowel?'모음(a, e, i, o, u) 중 하나':'모음(a, e, i, o, u)이 아닌 글자'}예요.<br>소리를 다시 잘 들어봐요 💡`,'hint');
      speak(q.word.en);
      setTimeout(()=>{m.picked=[];drawMs();},600);
    }
  }else{
    session.locked=true;
    setTimeout(()=>{m.reveal=true;drawMs();document.getElementById('mword').classList.add('reveal');onFinalWrong();},500);
  }
}

      <h3>📅 날짜별 기록</h3>
      ${hist.length?`<div class="table-wrap"><table><thead><tr><th>날짜</th><th>학습 단어</th><th>틀린 단어</th><th>별</th></tr></thead><tbody>
        ${hist.map(h=>`<tr><td>${h.date}${h.plays>1?`<br><span class="muted small">${h.plays}번 플레이</span>`:''}${h.games&&h.games.length?`<br><span class="muted small">${h.games.map(g=>GAME_INFO[g]?GAME_INFO[g].name.split(' ').pop():'').join(' ')}</span>`:''}</td><td>${h.words.map(w=>`<div>${esc(w.en)} <span class="muted">${esc(w.ko)}</span> ${badge(w.source,true)}</div>`).join('')}</td><td>${h.wrong.length?h.wrong.map(esc).join(', '):'-'}</td><td>⭐ ${h.stars}</td></tr>`).join('')}
      </tbody></table></div>`:'<p class="muted">아직 기록이 없어요. 첫 모험을 마치면 여기에 쌓여요.</p>'}
    </div>
    <div class="row between">
      <button class="btn ghost sm" onclick="goWords('admin')">🎒 단어 관리로</button>
      <button class="btn ghost sm" onclick="resetRecords()">🗑️ 기록 초기화</button>
    </div>`);
}
async function resetRecords(){
  const ok=await confirmBox('별, 칭호, 학습 기록, 틀린 단어, 게임별 정답률을 모두 지울까요?<br><span class="muted small">단어 주머니, 아이 이름, 비밀번호는 그대로 남아요. 지운 기록은 되돌릴 수 없어요.</span>','모두 지우기','취소');
  if(!ok) return;
  const t=todayObj(); if(t&&!t.done) returnToQueues(t);
  Object.assign(S,{stars:0,history:[],wrong:{},wordBook:{},streak:0,lastStudy:null,today:null,bonus:{date:'',count:0},gstats:{}});
  save();goRecords();toast('기록을 초기화했어요');
}

goHome();
</script>
